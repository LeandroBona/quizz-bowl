services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: quizbowl
      MYSQL_USER: quizbowl
      MYSQL_PASSWORD: quizbowl
      MYSQL_ROOT_PASSWORD: root_local_only
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_local_only"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
